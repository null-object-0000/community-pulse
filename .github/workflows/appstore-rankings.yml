name: App Store 榜单快照

# 需求侧基建 ①：榜单历史不可回补，所以每天都要抓。
# 这里只存归一化的排名结果（demand/appstore-rankings/<日期>.json），来源是 App Store 官方旧版 RSS，
# 免费无需 key；公开数据，进 Git 不涉及隐私。

on:
  schedule:
    - cron: '30 1 * * *' # 09:30 CST
  workflow_dispatch:

concurrency:
  group: appstore-rankings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取快照
        run: node scripts/demand/appstore-rankings.js

      - name: 提交当天快照
        run: |
          set -euo pipefail
          git config user.name "devtrends-bot"
          git config user.email "bot@devtrends.site"
          git add demand/appstore-rankings
          if git diff --staged --quiet; then
            echo "当天快照没有变化，跳过提交"
            exit 0
          fi
          latest=$(ls -1 demand/appstore-rankings/*.json | tail -1)
          day=$(basename "$latest" .json)
          git commit -m "data(demand): ${day} App Store 榜单快照"
          git push
