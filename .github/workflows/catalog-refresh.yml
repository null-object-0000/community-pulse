name: 刷新产品库（MySQL + 站点快照）

# 手动补跑「产品库投影」。适用场景：
#   1. 仓库里的 source-raw / raw 修正过之后（例如 2026-09-17 的投稿正文插图回填），MySQL 里的
#      `product_details.item_json` 还是旧投影，产品详情页与趋势分类页看不到新数据；
#   2. 只想按当前 MySQL 重建站点快照 —— 传 `skip_import=true`；
#   3. 修正后的内容比库里那行**更短**（例如清掉简介里的 HTML 残骸）：分数比较天然拒绝覆盖，
#      必须传 `full_rebuild=true` 跑一次完整历史（详情行无条件覆盖），见 2026-09-18 的 `<img … />` 残骸。
#
# 幂等：导入全是 upsert（日期取 LEAST/GREATEST、详情按 observed_date + content_score 覆盖），
# 重复跑不会写坏数据；快照按 `--to` 复用同版本缓存，重建后 `catalog-version.mjs` 变化会让
# Worker 的产品页边缘缓存键失效。
on:
  workflow_dispatch:
    inputs:
      start:
        description: '导入起始日期 YYYY-MM-DD'
        required: true
        default: '2026-01-01'
      end:
        description: '导入结束日期 YYYY-MM-DD（留空 = 最新已发布日报）'
        required: false
        default: ''
      snapshot_to:
        description: '站点快照截止日 YYYY-MM-DD（留空 = 最新已发布日报）'
        required: false
        default: ''
      skip_import:
        description: '只重建站点快照，不写 MySQL'
        type: boolean
        required: false
        default: false
      refresh_snapshot:
        description: '跳过同版本快照缓存（MySQL 变了但日期没变时必须开）'
        type: boolean
        required: false
        default: true
      full_rebuild:
        description: '全量重建详情行：跑完整历史 + 直接覆盖 product_details（修「清洗后简介变短、分数更低，upsert 永不覆盖」的历史行）'
        type: boolean
        required: false
        default: false
      revoke_ids:
        description: '要定向撤销的旧 product_id（逗号分隔，留空 = 不撤销）。用于「地址修好、身份跟着变了」的历史行：导入会建出新身份，旧行不会被 upsert 覆盖，必须显式删掉'
        required: false
        default: ''

permissions:
  contents: write

# 手动补跑可能一跑就是几小时（全量导入），而它没有 concurrency 保护时，重复触发会让多个
# 运行叠加跑同一份导入 —— 2026-09-17 就是这样白烧了 376 分钟 Actions 配额（两次被手动取消
# 的运行合计跑了 6 小时，取消同样计费）。队列只保留最新的一个待跑，正在跑的不会被掐断。
concurrency:
  group: catalog-refresh
  cancel-in-progress: false

env:
  # 内部批处理走生产 Worker 的 workers.dev 入口，绕过公开主域的浏览器验证。
  CATALOG_API_ORIGIN: https://community-pulse.nichangen.workers.dev

jobs:
  catalog-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装项目依赖
        run: npm ci

      - name: 确定日期范围
        id: dates
        run: |
          LATEST="$(ls 知识/大家都在做什么/raw | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sed 's/\.json$//' | sort | tail -1)"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          TO="${{ github.event.inputs.snapshot_to }}"
          [ -n "$END" ] || END="$LATEST"
          [ -n "$TO" ] || TO="$LATEST"
          echo "最近一期日报: $LATEST"
          echo "导入范围: $START .. $END"
          echo "站点快照: $TO"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"

      - name: 预检产品库读入口
        run: |
          node -e 'const { fetchJson } = require("./scripts/catalog/build-site-snapshot"); fetchJson(process.env.CATALOG_API_ORIGIN, "/api/v1/sources").then(data => { if (!Array.isArray(data.sources) || !data.sources.length) throw Error("Catalog API returned no sources"); console.log("Catalog API ready:", data.sources.length, "sources"); }).catch(error => { console.error(error.message); process.exitCode = 1; })'

      - name: 应用待执行的 schema 迁移
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 迁移与导入解耦：即使 skip_import=true（只重建快照）也照常把 schema 收敛。
          # 走临时 Worker 通道而不是直连 —— 出口连不上 RDS 3306，而 Hyperdrive 又不支持 SQL 级
          # PREPARE，所以幂等由 scripts/catalog/apply-mysql-migrations.js 的记账保证。
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN：无法应用迁移。"
            exit 1
          fi
          node scripts/catalog/apply-mysql-migrations.js --channel

      - name: 生成 MySQL 导入包
        if: ${{ github.event.inputs.skip_import != 'true' }}
        run: |
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then
            # 不带 --start/--end：构建期看到整段历史，详情行无条件覆盖（--replace-details 会拒绝
            # 带范围/来源过滤的调用，见 build-mysql-import.js 的注释）。
            echo "全量重建：跑完整历史 + 直接覆盖 product_details"
            node scripts/catalog/build-mysql-import.js --replace-details
          else
            node scripts/catalog/build-mysql-import.js --start "${{ steps.dates.outputs.start }}" --end "${{ steps.dates.outputs.end }}"
          fi
          node scripts/catalog/check-mysql-import.js

      - name: 写入 MySQL
        if: ${{ github.event.inputs.skip_import != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN：无法写入产品库。"
            exit 1
          fi
          node scripts/catalog/upload-mysql.js

      # 撤销必须排在「写入 MySQL」之后、「生成站点快照」之前：导入按新身份建行，旧身份那行不会被
      # upsert 覆盖，得定向删；快照读的是删完之后的库，顺序反了会把刚删掉的行又写进快照。
      # 撤销 SQL 由 revoke-products.js 生成（只认 product_id，单来源闸 @shared <= 1，
      # 并且挡下本次 --range 会重建的 id），--verify 只保留线上真的返回 200 的那些。
      #
      # `--inspect` 把「单来源闸挡下了哪几行」写进报告并以退出码 1 收尾：多来源的旧行一行都删不掉，
      # 而脚本从返回值上看不出这个区别（2026-09-22 就这样漏过一次）。`continue-on-error` 是刻意的 ——
      # 导入已经写完了，快照必须照建，红着的这一步留给人工决定怎么补撤销。
      - name: 撤销身份被修正的旧产品行
        if: ${{ github.event.inputs.revoke_ids != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN：无法撤销产品行。"
            exit 1
          fi
          ARGS=""
          for id in $(echo "${{ github.event.inputs.revoke_ids }}" | tr ',' ' '); do
            ARGS="$ARGS --product $id"
          done
          echo "待撤销：$ARGS"
          node scripts/catalog/revoke-products.js $ARGS \
            --range "${{ steps.dates.outputs.start }}..${{ steps.dates.outputs.end }}" \
            --verify --inspect --apply --out .scratch/revoke-products

      - name: 从 MySQL 生成版本化站点快照
        run: |
          REFRESH=""
          [ "${{ github.event.inputs.refresh_snapshot }}" = "true" ] && REFRESH="--refresh"
          npm run catalog:snapshot -- --to "${{ steps.dates.outputs.to }}" $REFRESH

      - name: 提交并推送快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/site-snapshot/ worker/catalog-version.mjs
          git commit -m "data(catalog): 重建站点快照至 ${{ steps.dates.outputs.to }}" || echo "无变更可提交"
          for i in 1 2 3; do
            if git push; then
              break
            else
              echo "push 冲突, 第 ${i} 次 pull --rebase 后重试"
              git pull --rebase origin main || true
              sleep 2
            fi
          done
