name: 大家都在做什么·日报

on:
  schedule:
    # 每天 00:07 北京时间 = 前一天 16:07 UTC。
    # 零点后昨日北京日已完整结束；错开整点减少 GitHub 调度拥堵。
    - cron: '7 16 * * *'
  workflow_dispatch: # 手动触发
    inputs:
      DATE:
        description: '回溯日期 YYYY-MM-DD (默认昨日)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 供来源层 GitHub 采集脚本使用
  CATALOG_API_ORIGIN: https://community-pulse.nichangen.workers.dev # 内部快照读入口，绕过公开主域的浏览器验证
  COMMUNITY_PULSE_PROXY: ''               # Actions 环境不走代理 (runner 直连/gh 认证)
  # Product Hunt GraphQL token（按官方配额退避重试；多 token 时按顺序轮询，见 ph_tokens.js）
  PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
  PRODUCT_HUNT_TOKEN_2: ${{ secrets.PRODUCT_HUNT_TOKEN_2 }}
  PRODUCT_HUNT_TOKEN_3: ${{ secrets.PRODUCT_HUNT_TOKEN_3 }}
  PRODUCT_HUNT_TOKEN_4: ${{ secrets.PRODUCT_HUNT_TOKEN_4 }}
  PRODUCT_HUNT_TOKEN_5: ${{ secrets.PRODUCT_HUNT_TOKEN_5 }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.setdate.outputs.date }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          # 产品库与站点快照脚本使用 Node 24 的稳定运行时。
          node-version: 24

      - name: 安装项目依赖
        run: npm ci

      # 预检只是**尽早上报**读通道有问题；它不产出日报的任何内容，因此失败不该挡住日报。
      # 真坏了下游的 MySQL / 快照步骤仍会红（它们现在都排在提交之后），不会静默。
      - name: 预检产品库读入口
        continue-on-error: true
        run: |
          node -e 'const { fetchJson } = require("./scripts/catalog/build-site-snapshot"); fetchJson(process.env.CATALOG_API_ORIGIN, "/api/v1/sources").then(data => { if (!Array.isArray(data.sources) || !data.sources.length) throw Error("Catalog API returned no sources"); console.log("Catalog API ready:", data.sources.length, "sources"); }).catch(error => { console.error(error.message); process.exitCode = 1; })'

      - name: 安装 gh CLI (已随 ubuntu-latest 自带, 此步兼容旧runner)
        run: gh --version || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y)

      - name: gh 认证 (内置 token)
        run: gh auth status

      - name: 确定目标日期 (输入参数或昨日)
        id: setdate
        run: |
          if [ -n "${{ github.event.inputs.DATE }}" ]; then
            echo "date=${{ github.event.inputs.DATE }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Shanghai date -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: 补齐并校验来源层原始日数据
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          cd .agents/skills/community-pulse
          # 各来源从自己的起始日寻找最早缺失日；正常情况下只抓北京时间昨天。
          node scripts/capture_vibecafe_raw.js --resume --end "$TARGET"
          node scripts/validate_vibecafe_raw.js --start 2026-06-02 --end "$TARGET"
          node scripts/capture_chinese_indie_raw.js --resume --end "$TARGET"
          node scripts/validate_chinese_indie_raw.js --start 2026-01-01 --end "$TARGET"
          # 同一仓库还有程序员版 / 游戏版子版面，各自独立成源、独立日文件。
          node scripts/capture_chinese_indie_raw.js --board programmer --resume --end "$TARGET"
          node scripts/validate_chinese_indie_raw.js --board programmer --start 2026-01-01 --end "$TARGET"
          node scripts/capture_chinese_indie_raw.js --board game --resume --end "$TARGET"
          node scripts/validate_chinese_indie_raw.js --board game --start 2026-01-01 --end "$TARGET"
          node scripts/capture_github_issues_raw.js --resume --end "$TARGET"
          node scripts/validate_github_issues_raw.js --start 2026-01-01 --end "$TARGET"
          node scripts/capture_periodicals_raw.js --resume --end "$TARGET"
          node scripts/validate_periodicals_raw.js --start 2026-01-01 --end "$TARGET"
          # Trending 没有历史日期接口：保存运行时当天的完整页面快照，不冒充 TARGET 的历史数据。
          OBSERVED="$(TZ=Asia/Shanghai date +%F)"
          node scripts/capture_github_trending_raw.js --date "$OBSERVED"
          node scripts/validate_github_trending_raw.js --date "$OBSERVED"
          # Product Hunt GraphQL 按应用每 15 分钟限制 complexity；多应用逐页轮询。
          # 历史缺口由 capture_producthunt_raw.js --resume --wait-on-rate-limit 专门回填。
          node scripts/capture_producthunt_raw.js --date "$TARGET"
          node scripts/validate_producthunt_raw.js --start "$TARGET" --end "$TARGET"
          # Show HN 是英文世界最大的「我做了个东西」渠道，Algolia 可按北京日回溯：
          # 当天用观察快照，历史缺口用 --start/--end 重建（模式写进 capture.mode）。
          node scripts/capture_showhn_raw.js --date "$TARGET"
          node scripts/validate_showhn_raw.js --date "$TARGET"
          # V2EX 分享创造节点是中文侧同类渠道，但公开 API 只返回当前 10 条、无历史接口，
          # 因此和 Trending 一样只保存观察日快照（--date 必须等于当天，脚本自身会拒绝回溯）。
          node scripts/capture_v2ex_raw.js --date "$OBSERVED"
          node scripts/validate_v2ex_raw.js --date "$OBSERVED"
          # 统一发现所有来源中的 GitHub 仓库，并将 API 原对象按报告日落盘。
          node scripts/capture_github_repositories_raw.js --date "$TARGET" --observed-date "$OBSERVED"
          node scripts/validate_github_repositories_raw.js --date "$TARGET"

      # 官网 Logo 兜底层是**增强层**，不是日报的必需输入：`source_raw_items.js` 的
      # `loadSiteLogos` 在文件缺失时返回 null ——「没有这一天文件」只意味着那些行继续用
      # 文字头像（脚本内注释原话）。而 `--strict` 会让任一源站抽风就整步失败。
      # 所以它失败时应当降级为「少一些 logo」，而不是丢掉整期日报。
      - name: 抓取官网 Logo 兜底层（没有产品标志的行）
        continue-on-error: true
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          OBSERVED="$(TZ=Asia/Shanghai date +%F)"
          cd .agents/skills/community-pulse
          # 没有平台产品标志的行改为读取其官网自己声明的 logo（apple-touch-icon / rel=icon /
          # schema.org logo，最后才是 /favicon.ico）。这一步必须晚于 GitHub 仓库快照：官网地址
          # 常常只存在于仓库 homepage 字段里。Trending 行写在观察日文件，与 collect.js 的读取日一致。
          node scripts/capture_site_logos_raw.js --date "$TARGET" --observed-date "$OBSERVED" --strict
          node scripts/validate_site_logos_raw.js --date "$TARGET"

      # 纯环境准备：只服务下一步截图，而截图步自己已经 `|| true`。apt 镜像抽风不该挡住日报。
      - name: 准备截图环境（CJK 字体 + webp 工具）
        continue-on-error: true
        run: |
          # runner 镜像只带 fonts-noto-color-emoji，中文官网会渲成方框；webp 工具没有就只能
          # 落 PNG（每期 8.7MB 而不是 0.6MB），所以两者都装。
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk webp

      - name: 抓取官网首屏截图（有官网的行）
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          OBSERVED="$(TZ=Asia/Shanghai date +%F)"
          cd .agents/skills/community-pulse
          # 截图比 logo 层贵（每张几百 KB，缩成 640px webp 后约 15KB），所以单独一层、单独
          # 保留期。runner 预装 Chrome，不需要 Playwright。渲染后再验一次 DOM，Chrome 自己的
          # 错误页是「看起来成功」的失败（实测 orcarouter.ai 就截到过）。
          node scripts/capture_screenshots_raw.js --date "$TARGET" --observed-date "$OBSERVED" || true

      - name: 生成日报 (md + json, 存 raw/)
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          OBSERVED="$(TZ=Asia/Shanghai date +%F)"
          echo "目标日期: $TARGET"
          mkdir -p "知识/大家都在做什么/raw"
          cd .agents/skills/community-pulse
          # 后续处理只读取上一步已校验的 source-raw，不再访问任何源站。
          # Trending 读实际观察日，其余来源读 TARGET 日分区。
          node scripts/collect.js --strict --require-github-repositories --date "$TARGET" --observed-date "$OBSERVED" --markdown --out "../../../知识/大家都在做什么/raw/$TARGET.md" --json-out "../../../知识/大家都在做什么/raw/$TARGET.json"
          ls -la "../../../知识/大家都在做什么/raw/$TARGET."*

      # 图片清单与评论数快照都是**要随这次提交进仓库**的产物，所以必须排在提交之前。
      - name: 持久化站点图片
        run: npm run images:sync

      # 评论数只是日历上的**展示数字**（`data/comment-counts.json` 仅被 build-site 读），
      # 拉不到就沿用上一份，绝不该因此丢掉整期日报 —— 2026-10-17 就是这么丢的：
      # 这一步连 GitHub API 抽风 `fetch failed`，而它排在提交之前，后面全部 skipped。
      # 它每天都会重跑，失败即自愈；步骤本身在 UI 里仍显示为红，不会静默。
      - name: 同步历史日报评论数
        continue-on-error: true
        run: npm run comments:sync

      # **日报产物在这里先落地**：日报需要的是 `raw/<date>.md|json` + 图片来源 + 评论数。
      #
      # 顺序理由（两次实测教训）：原来「提交日报」排在「将全量产品观察增量写入 MySQL」之后，
      # 于是那条通道一失败，**当期日报整期进不了仓库**——
      #   · 2026-09-24：快照拉分类数据撞 502 ⇒ 当期日报没提交，07:30 无东西可发；
      #   · 2026-10-09：MySQL 通道撞 HTML 404、`Uploaded 0/7` ⇒ 同样下场。
      # 反过来说，MySQL 导入失败是可以事后幂等补的（`catalog-refresh.yml`），而**日报没提交
      # 就等于那一期不存在**。所以「先落盘，再做周边」：日报先提交，外围步骤排在它后面。
      #
      # **R2 上传不算「外围」，它紧跟提交、排在 MySQL 之前**（2026-10-15 的教训）：产品标志
      # 能从源站重下，但**官网首屏截图的字节只存在于采集它的那台 runner 上**
      # （`source-raw/screenshots-files/`，按内容寻址且不入 Git），runner 一销毁就再也补不回来。
      # 旧版本把它排在 MySQL 之后，2026-10-14 那期 MySQL 一挂它就被 skip ⇒ 51 张截图随 runner
      # 永久丢失（补传 workflow 只能重下标志、拿不到截图字节）。凡是**没有第二份字节**的产物，
      # 都不能排在会失败的通道后面。
      - name: 提交日报并推送
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 来源层可能顺手修复更早的缺口，因此提交所有来源的日分区目录。
          git add "知识/大家都在做什么/raw/$TARGET.md" "知识/大家都在做什么/raw/$TARGET.json" "知识/大家都在做什么/source-raw/"
          git add assets/images/ data/comment-counts.json
          git commit -m "docs: $TARGET 大家都在做什么日报(raw)" || echo "无变更可提交"
          # 并发 push 可能冲突: pull --rebase 后再推 (最多重试 3 次)
          for i in 1 2 3; do
            if git push; then
              break
            else
              echo "push 冲突, 第 ${i} 次 pull --rebase 后重试"
              git pull --rebase origin main || true
              sleep 2
            fi
          done

      # 镜像已移出 Git（见 .gitignore）：这一步必须成功，否则当天新增的图片只存在于 runner 上，
      # 线上会引用 R2 里不存在的对象而破图。因此不再静默跳过，缺凭证直接失败。
      # **排在 MySQL 导入 / 站点快照之前**：截图那类资产没有第二份字节，不能被别的通道连累
      # （详见上面「R2 上传不算外围」的注释）。
      - name: 上传新图片到 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_BASE: ${{ vars.IMAGE_BASE || 'https://img.devtrends.site' }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'community-pulse-images' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN：镜像已移出 Git，不上传会导致线上破图。"
            echo "请在仓库 Settings → Secrets 配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后重跑。"
            exit 1
          fi
          npm run images:upload

      - name: 将全量产品观察增量写入 MySQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN：全量产品库不能落入 MySQL。"
            exit 1
          fi
          TARGET="${{ steps.setdate.outputs.date }}"
          OBSERVED="$(TZ=Asia/Shanghai date +%F)"
          # 直接从 source-raw 生成 TARGET..OBSERVED 的 MySQL 增量包；稳定 product_id
          # 与 MySQL upsert 让重复执行幂等。Product Hunt 使用全量 records，不是精选日报子集。
          node scripts/catalog/build-mysql-import.js --start "$TARGET" --end "$OBSERVED"
          node scripts/catalog/check-mysql-import.js
          node scripts/catalog/upload-mysql.js

      # 产品级增强的**读队列**这一跳，必须排在「将全量产品观察增量写入 MySQL」之后 ——
      # 早于它，当天新产品的 taxonomy_assignments 还没落库，旅行臂（useCases 含 travel-mobility）
      # 查不到，会静默少跑。队列口径与日更链共用 `enrich-products.js` 的 `queueSql`。
      #
      # `continue-on-error`：这一跳只是日报的**附件**（模型在本机、写库在后面的 apply workflow），
      # 失败不该连累日报存在 —— 与「先落盘，再做周边」同一条纪律（见 CHANGELOG 2026-09-24）。
      # 真失败由 `product-enhancement-watchdog.yml` 报警；本机侧拉不到产物也会停住而不是空跑。
      - name: 导出当天产品增强队列（供本机跑模型）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          mkdir -p .scratch
          node scripts/catalog/export-queue.js \
            --date "$TARGET" \
            --out ".scratch/queue-$TARGET.json" \
            --status-out ".scratch/status-$TARGET.json"

      - name: 上传产品增强队列产物
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: enrich-queue-${{ steps.setdate.outputs.date }}
          path: |
            .scratch/queue-${{ steps.setdate.outputs.date }}.json
            .scratch/status-${{ steps.setdate.outputs.date }}.json
          # 产物是本机侧唯一能拿到的队列副本；保留 14 天，本机定时任务必须在这个窗口内取走。
          retention-days: 14
          if-no-files-found: warn

      - name: 从 MySQL 生成版本化站点快照
        run: |
          # 公共趋势与全部受控分类页只读这份可重建快照；来源自定义才走实时 API。
          # 快照生成器会分页拉取固定 12 周分类列表，并同时更新 Worker 的缓存版本；
          # 全历史与任意日期范围保留给实时 API，避免把数百 MB 数据重复提交到 Git。
          # 排在日报提交**之后**：这一步失败只损失一次窗口刷新（可用 catalog-refresh.yml 补），
          # 不该把当天的日报挡在门外。
          npm run catalog:snapshot -- --to "${{ steps.setdate.outputs.date }}"

      - name: 提交站点快照并推送
        run: |
          TARGET="${{ steps.setdate.outputs.date }}"
          # 构建期生成、提交进仓库的常量：catalog 快照版本、静态资源内容哈希版本、ICP 备案号
          # （worker/asset-version.mjs 与 worker/icp.mjs 由 npm run build 写，Worker 从它们 import）。
          git add data/catalog/site-snapshot/ worker/catalog-version.mjs worker/asset-version.mjs worker/icp.mjs
          git commit -m "data(catalog): $TARGET 站点快照" || echo "无变更可提交"
          for i in 1 2 3; do
            if git push; then
              break
            else
              echo "push 冲突, 第 ${i} 次 pull --rebase 后重试"
              git pull --rebase origin main || true
              sleep 2
            fi
          done

      # **必须在「提交日报并推送」之后**：这一步是核对，不是门禁闸门 —— 数据该落的先落下，
      # 身份漂移单独变红。它排在推送之前时，一条行算错就把整期日报挡在门外
      # （2026-09-23 实测：门禁自己算出的假漂移让当期 raw / final / 站点全部缺失）。
      - name: 核对日报行与产品库的身份一致
        run: npm run check:report-identity -- --date "${{ steps.setdate.outputs.date }}"
