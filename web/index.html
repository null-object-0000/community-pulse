<!doctype html>
<html lang="{{locale}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f3" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="{{robots}}" />
    <meta name="application-name" content="DevTrends" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" hreflang="zh-CN" href="{{zhUrl}}" />
    <link rel="alternate" hreflang="en" href="{{enUrl}}" />
    <link rel="alternate" hreflang="x-default" href="{{zhUrl}}" />
    <link rel="alternate" type="application/rss+xml" title="{{feedTitle}}" href="{{feedUrl}}" />
    <link rel="icon" href="/logo.svg?v={{assetVersion}}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevTrends" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <meta name="twitter:image:alt" content="{{ogImageAlt}}" />
    <script src="/theme.js?v={{assetVersion}}"></script>
    <link rel="stylesheet" href="/token.css?v={{assetVersion}}" />
    <link rel="stylesheet" href="/styles.css?v={{assetVersion}}" />
    <noscript><style>.chip-row { flex-wrap: wrap; overflow: visible; }</style></noscript>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1E9PXZ2EVK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1E9PXZ2EVK');</script>
    <!-- Clarity tracking code for https://devtrends.site/ (Microsoft 官方片段，async 不阻塞渲染) -->
    <script>
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yhhvfzftgj");
    </script>
    {{structuredData}}
  </head>
  <body data-view="{{view}}"{{bodyAttrs}}>
    <a class="skip-link" href="#main">{{skip}}</a>
    <header class="topbar"><div class="topbar-inner">
      <a class="brand" href="{{homePath}}" aria-label="DevTrends"><svg class="brand-logo" width="34" height="34" viewBox="0 0 48 48" role="img" aria-label="DevTrends"><rect x="1" y="1" width="46" height="46" rx="12" fill="#161b22"/><path fill="#fff" fill-rule="evenodd" d="M9.5 9h12c9.39 0 17 6.72 17 15s-7.61 15-17 15h-12V9Zm8 8v14h4c4.97 0 9-3.13 9-7s-4.03-7-9-7h-4Z"/><path d="m15.5 30.51 5.8-5.81 3.7 2.8 6.7-7.7M27.48 20.62 31.7 19.8 31.47 24.09" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>DevTrends<small>{{brandLabel}}</small></span></a>
      <nav class="main-nav" aria-label="{{navLabel}}">{{navigation}}</nav>
      {{headerSearch}}
      <div class="preferences">
        <details class="theme-picker" id="theme-picker">
          <summary aria-label="{{themeLabel}}" title="{{themeLabel}}">
            <svg class="theme-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            <svg class="theme-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 14a9 9 0 0 1-10.5-10.5A9 9 0 1 0 20.5 14Z"/></svg>
          </summary>
          <div class="theme-options" role="group" aria-label="{{themeLabel}}">
            <button type="button" data-theme-choice="light" aria-pressed="false"><span aria-hidden="true">☀</span>{{light}}<span class="theme-check" aria-hidden="true">✓</span></button>
            <button type="button" data-theme-choice="dark" aria-pressed="false"><span aria-hidden="true">☾</span>{{dark}}<span class="theme-check" aria-hidden="true">✓</span></button>
            <button type="button" data-theme-choice="system" aria-pressed="true"><span aria-hidden="true">▣</span>{{system}}<span class="theme-check" aria-hidden="true">✓</span></button>
            <div class="theme-options-divider" aria-hidden="true"></div>
            <span class="accent-options-label">{{accentLabel}}</span>
            <div class="accent-options" role="group" aria-label="{{accentLabel}}">
              <button type="button" data-accent-choice="neutral" aria-label="{{neutralAccent}}" title="{{neutralAccent}}" aria-pressed="true"><span class="accent-swatch is-neutral" aria-hidden="true"></span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button type="button" data-accent-choice="blue" aria-label="{{blueAccent}}" title="{{blueAccent}}" aria-pressed="false"><span class="accent-swatch is-blue" aria-hidden="true"></span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button type="button" data-accent-choice="forest" aria-label="{{forestAccent}}" title="{{forestAccent}}" aria-pressed="false"><span class="accent-swatch is-forest" aria-hidden="true"></span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button type="button" data-accent-choice="violet" aria-label="{{violetAccent}}" title="{{violetAccent}}" aria-pressed="false"><span class="accent-swatch is-violet" aria-hidden="true"></span><span class="theme-check" aria-hidden="true">✓</span></button>
            </div>
          </div>
        </details>
        <label class="language-picker"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg><span class="sr-only">{{languageLabel}}</span><select id="language-select" aria-label="{{languageLabel}}"><option value="zh-CN" {{zhSelected}}>简体中文</option><option value="en" {{enSelected}}>English</option></select><svg class="select-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label>
      </div>
    </div></header>
    <main id="main" class="workspace">{{content}}</main>
    <footer class="footer"><a class="footer-brand" href="{{homePath}}">DevTrends <span>↗</span></a><p>{{footer}}</p></footer>
    <script id="page-data" type="application/json">{{pageData}}</script>
    <script src="/shared.js?v={{assetVersion}}" defer></script>
    {{pageScript}}
  </body>
</html>
