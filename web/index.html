<!doctype html>
<html lang="{{locale}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="{{robots}}" />
    <meta name="application-name" content="DevTrends" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" hreflang="zh-CN" href="{{zhUrl}}" />
    <link rel="alternate" hreflang="en" href="{{enUrl}}" />
    <link rel="alternate" hreflang="x-default" href="{{zhUrl}}" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevTrends" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1E9PXZ2EVK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1E9PXZ2EVK');</script>
    {{structuredData}}
  </head>
  <body data-view="{{view}}">
    <a class="skip-link" href="#main">{{skip}}</a>
    <header class="topbar"><div class="topbar-inner">
      <a class="brand" href="{{homePath}}" aria-label="DevTrends"><img src="/logo.svg" alt="" width="34" height="34" /><span>DevTrends<small>{{brandLabel}}</small></span></a>
      <nav class="main-nav" aria-label="{{navLabel}}">{{navigation}}</nav>
      <div class="preferences"><label><span class="sr-only">{{languageLabel}}</span><select id="language-select" aria-label="{{languageLabel}}"><option value="zh-CN" {{zhSelected}}>中文</option><option value="en" {{enSelected}}>English</option></select></label><label><span class="sr-only">{{themeLabel}}</span><select id="theme-select" aria-label="{{themeLabel}}"><option value="system">{{system}}</option><option value="light">{{light}}</option><option value="dark">{{dark}}</option></select></label></div>
    </div></header>
    <main id="main" class="workspace">{{content}}</main>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer class="footer"><a class="footer-brand" href="{{homePath}}">DevTrends <span>↗</span></a><p>{{footer}}</p><a href="https://github.com/null-object-0000/community-pulse" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
    <script id="page-data" type="application/json">{{pageData}}</script>
    <script src="/shared.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
