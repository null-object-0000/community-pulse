    <path fill="#fff" fill-rule="evenodd" d="M21.4 20.3h27c21.1 0 38.3 15.1 38.3 33.7S69.5 87.8 48.4 87.8h-27V20.3Zm18 18v31.5h9c11.2 0 20.3-7 20.3-15.8s-9.1-15.7-20.3-15.7h-9Z"/>
    <path d="m34.9 68.6 13.1-13 8.3 6.2 15-17.3" fill="none" stroke="#58a6ff" stroke-width="6.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m61.9 46.3 9.4-1.8-.5 9.6" fill="none" stroke="#58a6ff" stroke-width="6.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

