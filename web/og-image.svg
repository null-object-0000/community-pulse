  <text x="225" y="174" fill="#64748b" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="600" letter-spacing="4">开发者趋势</text>
  <text x="82" y="320" fill="#0f172a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="66" font-weight="760" letter-spacing="-2">大家都在做什么</text>
  <text x="84" y="377" fill="#475569" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29">每天发现新项目、新产品与开源趋势</text>
  <text x="84" y="519" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" letter-spacing="1">DEV TRENDS / DAILY DISCOVERIES</text>

  <g transform="translate(780 178)" fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
